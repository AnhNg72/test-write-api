apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-write-api
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/AnhNg72/test-write-api.git
    targetRevision: HEAD
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: test-write-api

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true