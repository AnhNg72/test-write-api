name: Build & Push (Minikube Runner)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      # 2. Login to private registry
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: 172.29.176.1:5000
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            172.29.176.1:5000/test-write-api:${{ github.sha }}

        # 4. update deployment manifest
      - name: Update deployment manifest
        run: |          
          $tag="${{ github.sha }}"
          (Get-Content k8s/deployment.yaml) -replace 'image: .*', "image: 172.29.176.1:5000/test-write-api:$tag" | Set-Content k8s/deployment.yaml

        # 5. Commit changes to git repo
      - name: Commit changes
        run: |
          git config user.name "AnhNg72"
          git config user.email "VanAnh.Nguyen@liebherr.com"
          git add .
          git commit -m "Update test image to ${{ github.sha }}"
          git push