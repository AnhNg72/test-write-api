name: Build & Push (Minikube Runner)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted #test

    steps:
      # 1. Checkout source
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Debug environment (important for first runs)
      - name: Debug environment
        run: |
          echo "Running on:"
          systeminfo
          echo "Docker version:"
          docker version
          echo "Kubectl version:"
          kubectl version --client

      # 3. Build Docker image
      - name: Build image
        run: |
          docker build -t 172.29.176.1:5000/test-write-api:0.0.1-SNAPSHOT .

      # 4. Login to registry
      - name: Docker login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login 172.29.176.1:5000 \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      # 5. Push image
      - name: Push image
        run: |
          docker push 172.29.176.1:5000/test-write-api:0.0.1-SNAPSHOT