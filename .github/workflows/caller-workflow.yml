name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - mkdocs.yml
      - pyproject.toml
      - package.json
      - package-lock.json

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: ./.github/workflows/_deploy-docs.yml
    with:
      runner: MCRNB89090
